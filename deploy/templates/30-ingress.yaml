apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aigw-budget-admin
  namespace: ${NAMESPACE}
  labels: {app: aigw-budget-admin}
spec:
  ingressClassName: ${INGRESS_CLASS}
${INGRESS_TLS}  rules:
    - host: ${PUBLIC_HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: aigw-budget-admin
                port: {number: 80}
